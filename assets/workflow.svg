<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 700" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/>
    </marker>
    <marker id="arrowP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="840" height="700" fill="#ffffff"/>

  <!-- Title -->
  <text x="420" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Git / GitHub 新手工作流</text>
  <text x="420" y="64" text-anchor="middle" font-size="13" fill="#64748b">从本地改动到云端协作，一张图看懂</text>

  <!-- Section 1: local -->
  <rect x="30" y="86" width="780" height="232" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="48" y="114" font-size="16" font-weight="700" fill="#0f172a">① 本地：修改 → 暂存 → 提交</text>

  <!-- working dir -->
  <rect x="60" y="136" width="180" height="120" rx="12" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">工作区</text>
  <text x="150" y="202" text-anchor="middle" font-size="12" fill="#1e40af">Working Directory</text>
  <text x="150" y="226" text-anchor="middle" font-size="12" fill="#334155">你正在编辑的文件</text>

  <!-- staging -->
  <rect x="330" y="136" width="180" height="120" rx="12" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="420" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">暂存区</text>
  <text x="420" y="202" text-anchor="middle" font-size="12" fill="#1e40af">Staging Area</text>
  <text x="420" y="226" text-anchor="middle" font-size="12" fill="#334155">git add 后的快照</text>

  <!-- local repo -->
  <rect x="600" y="136" width="180" height="120" rx="12" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="690" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">本地仓库</text>
  <text x="690" y="202" text-anchor="middle" font-size="12" fill="#1e40af">Local Repository</text>
  <text x="690" y="226" text-anchor="middle" font-size="12" fill="#334155">commit 历史</text>

  <!-- arrows 1 -->
  <line x1="241" y1="196" x2="327" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="284" y="188" text-anchor="middle" font-size="12" fill="#475569">git add</text>
  <line x1="511" y1="196" x2="597" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="554" y="188" text-anchor="middle" font-size="12" fill="#475569">git commit</text>

  <!-- push arrow to remote -->
  <path d="M690,257 C690,300 420,300 420,322" fill="none" stroke="#22c55e" stroke-width="2.4" marker-end="url(#arrowG)"/>
  <text x="586" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">git push</text>

  <!-- remote -->
  <rect x="300" y="324" width="240" height="78" rx="12" fill="#dcfce7" stroke="#22c55e"/>
  <text x="420" y="358" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">GitHub 远程仓库</text>
  <text x="420" y="382" text-anchor="middle" font-size="12" fill="#166534">Remote · main 分支</text>

  <!-- Section 2: branch & PR -->
  <rect x="30" y="436" width="780" height="238" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="48" y="464" font-size="16" font-weight="700" fill="#0f172a">② 分支与协作：feature → PR → Merge</text>

  <!-- main branch -->
  <rect x="60" y="486" width="180" height="96" rx="12" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="150" y="528" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">main 分支</text>
  <text x="150" y="552" text-anchor="middle" font-size="12" fill="#334155">稳定主线</text>

  <!-- feature branch -->
  <rect x="320" y="486" width="190" height="96" rx="12" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="415" y="528" text-anchor="middle" font-size="16" font-weight="700" fill="#5b21b6">feature 分支</text>
  <text x="415" y="552" text-anchor="middle" font-size="12" fill="#334155">git switch -c feat</text>

  <!-- remote feature -->
  <rect x="580" y="486" width="210" height="96" rx="12" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="685" y="528" text-anchor="middle" font-size="16" font-weight="700" fill="#5b21b6">GitHub: feature</text>
  <text x="685" y="552" text-anchor="middle" font-size="12" fill="#334155">git push 后出现</text>

  <!-- arrows 2 -->
  <line x1="241" y1="534" x2="317" y2="534" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowP)"/>
  <text x="279" y="526" text-anchor="middle" font-size="12" fill="#7c3aed">开分支</text>
  <line x1="511" y1="534" x2="577" y2="534" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowP)"/>
  <text x="544" y="526" text-anchor="middle" font-size="12" fill="#7c3aed">git push</text>

  <!-- PR -> merge return arrow -->
  <path d="M685,584 C685,648 150,648 150,586" fill="none" stroke="#22c55e" stroke-width="2.4" marker-end="url(#arrowG)"/>
  <text x="417" y="640" text-anchor="middle" font-size="13" font-weight="600" fill="#16a34a">Pull Request → Code Review → Merge 回 main</text>

  <!-- footer legend -->
  <text x="30" y="694" font-size="11" fill="#94a3b8">蓝色 = 本地操作　·　绿色 = 与 GitHub 同步　·　紫色 = 分支 / 协作</text>
</svg>
